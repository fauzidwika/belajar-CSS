<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Price</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tableprice.css">
</head>
<body>
    <div class="panel pricing-table">
        <div class="pricing-plan">
            <img src="icon/instagram.png" alt="" class="pricing-img">
            <h2 class="pricing-header">Instagram</h2>
            <ul class="pricing-features">
                <li class="pricing-features-items">Pro</li>
                <li class="pricing-features-items">All Access</li>
            </ul>
            <span class="pricing-price">$1</span>
            <a href="#/" class="pricing-button">Sign Up</a>
        </div>

        <div class="pricing-plan">
            <img src="icon/twitter.png" alt="" class="pricing-img">
            <h2 class="pricing-header">Twitter</h2>
            <ul class="pricing-features">
                <li class="pricing-features-items">Pro</li>
                <li class="pricing-features-items">All Access</li>
            </ul>
            <span class="pricing-price">$2</span>
            <a href="#/" class="pricing-button is-featured">Wanna Try?</a>
        </div>

        <div class="pricing-plan">
            <img src="icon/youtube.png" alt="" class="pricing-img">
            <h2 class="pricing-header">Youtube</h2>
            <ul class="pricing-features">
                <li class="pricing-features-items">Pro</li>
                <li class="pricing-features-items">All Access</li>
            </ul>
            <span class="pricing-price">$3</span>
            <a href="#/" class="pricing-button">Hurry Up</a>
        </div>
    </div>
</body>
</html>
